<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button menu="main-menu"></ion-menu-button>
    </ion-buttons>
    <ion-title>Chat de IA</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Chat de IA</ion-title>
    </ion-toolbar>
  </ion-header>
  @for (mensaje of historial; track mensaje.id) {
    <app-content-query-user [consulta]="mensaje.consulta"></app-content-query-user>
    <app-content-response-model [responseModel]="mensaje.respuesta"></app-content-response-model>
  }
  <app-prompt
    [archivo]="archivo"
    [subiendoArchivo]="subiendoArchivo"
    [eliminandoArchivo]="eliminandoArchivo"
    (consultaEnviada)="EnviarConsulta($event)"
    (archivoSeleccionado)="alCambiarArchivo($event)"
    (archivoEliminarSolicitado)="alEliminarArchivo($event)">
  </app-prompt>
</ion-content>
