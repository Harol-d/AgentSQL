<ion-footer>
  @if (archivo) {
    <div class="archivos-adjuntos" aria-label="Archivo seleccionado">
      <ion-chip>
        <ion-label>{{ archivo.nombre }}</ion-label>
        <ion-button
          fill="clear"
          size="small"
          aria-label="Quitar archivo"
          [disabled]="subiendoArchivo || eliminandoArchivo"
          (click)="quitarArchivo()">
          <ion-icon slot="icon-only" name="close-circle-outline"></ion-icon>
        </ion-button>
      </ion-chip>
    </div>
  }

  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button aria-label="Agregar archivo" [disabled]="subiendoArchivo || eliminandoArchivo" (click)="mostrarOpcionesArchivo()">
        <ion-icon slot="icon-only" name="add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <input
      #selectorArchivo
      type="file"
      hidden
      (change)="agregarArchivo($event)">

    <ion-input
      type="text"
      fill="solid"
      [(ngModel)]="Query"
      [placeholder]="marcador"
      (keyup.enter)="enviarConsulta()">
    </ion-input>

    <ion-buttons slot="end">
      <ion-button aria-label="Enviar" [disabled]="subiendoArchivo || eliminandoArchivo" (click)="enviarConsulta()">
        <ion-icon slot="icon-only" name="send-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
