services:
  llm:
    build: ./LLM/ 
    ports:
      - 4000:4000
    env_file:
      - .env
    environment:
      - LLM_PROVEEDOR=${LLM_PROVEEDOR}
      - LLM_MODEL=${LLM_MODEL}
      - API_KEY=${API_KEY}
      - PROJECT_ID=${PROJECT_ID}
      - BUCKET=${BUCKET}
      - ENDPOINT_ID=${ENDPOINT_ID}
      - DEPLOYED_INDEX_ID=${DEPLOYED_INDEX_ID}
